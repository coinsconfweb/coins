        affiliation: "Department Chair and Cockrell Family Chair for Engineering Leadership, University of Texas at Austin"
        title: "Energy Efficient Generative AI from Cloud to Edge"
        summary: >
          Addressed the gap between ML model accuracy and actual energy efficiency, latency,
          and battery lifetime, discussing platform-specific power models and hardware-aware
          design for efficient transformer and diffusion models across modalities.
      - name: "Mondira (Mandy) Deb Pant"
        affiliation: "TA-Chief of Staff, Lead Technologist, Intel Design Engineering Group"
        title: "Moore's Law in the AI era"
        summary: >
