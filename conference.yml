# Archives — one entry per past edition, rendered as a standalone
# page (pages/archive-<year>.html) so the conference's history survives
# even after each year's own site (coinsconf.com/<year>) is retired.
# Content below was extracted from the original per-year sites.
# Add a new entry here once a year's edition has concluded; the
# matching item in past_editions[] above will then link locally
# instead of out to the (eventually offline) original site.
# ─────────────────────────────────────────────────────────────
archives:
  - year: 2024
    edition_ordinal: "6th"
    location: "London, UK"
    dates_display: "July 29–31, 2024"
    format: "Hybrid (in-person & virtual)"
