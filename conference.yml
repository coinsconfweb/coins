phd_forum:
  title: "PhD & Student Forum"
  description: >
    The PhD forum is organized as a poster session with 1-minute 1-slide oral introductions
    from students to engage the audience. The forum provides an opportunity for graduate
    students to explore their research interests in an interdisciplinary workshop under the
    guidance of a panel of distinguished experts from both industry and academia.
  what_you_get:
    - "Present your research (1 slide + 1-minute oral + 1 poster) to specialists and a broad audience from the CAD, CAS, IoT, and AI community."
    - "Receive valuable feedback and foster networking from peers and experienced faculty."
    - "Establish contacts for entering the job market."
    - "Discuss ongoing trends in AI, IoT, CAS, and RAS."
  eligibility:
    - "Students who have finished their PhD thesis within the last 12 months."
    - "Students at any year of their PhD research activity."
  submission_info: >
    Submit a 2-page extended abstract (PDF) describing the novelties and advantages of the
    thesis work. Include name and affiliation. There will be no IEEE publications, but
    abstracts will be made available to all attendees in electronic format.
  submission_deadline: "TBA"
  notification: "TBA"
  format: "Poster session with 1-slide, 1-minute oral introduction per student."
  contact: "coins@coinsconf.com"
  chairs: []

