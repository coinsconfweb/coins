# ─────────────────────────────────────────────────────────────
# IEEE COINS – Conference Configuration
# Edit ONLY this file each year to update the entire website.
# Run: python build.py
# ─────────────────────────────────────────────────────────────

meta:
  edition: 2027
  acronym: "COINS"
  full_name: "IEEE International Conference on Omni-Layer Intelligent Systems"
  short_name: "IEEE COINS 2027"
  tagline: "From Silicon to Cloud — Intelligence Across Every Layer"
  domain: "coinsconf.com"
  # NOTE: EasyChair conference instance for 2027 may not exist yet — create it
  # at easychair.org and confirm this URL resolves before launching the CFP.
  easychair_url: "https://easychair.org/conferences?conf=ieeecoins2027"
  contact_email: "coins@coinsconf.com"
  # Conference logo shown in the nav bar and footer — a URL or a path under
  # static/img/ (e.g. "static/img/coins-logo.png"). Leave "" to keep the
  # default "IEEE <acronym> <edition>" text badge.
  logo: "static/img/logos/0.jpg"
  description: >
    IEEE COINS brings together researchers, engineers, and industry leaders to advance
    next-generation AI and intelligent systems spanning devices, architectures, and
    applications. It emphasizes cross-layer co-design, energy-efficient and secure
    computing, and the responsible integration of AI from embedded and edge platforms
    to agentic and autonomous systems.
  # Homepage hero headline — split so the template can put the emphasis line in <em>.
  hero_title_main: "Omni-Layer"
  hero_title_emphasis: "Intelligent Systems"
  # Homepage "About" section headline.
  about_headline: "Cross-Layer Intelligence from Silicon to Cloud"

dates:
  conference_start: "2027-08-02"
  conference_end:   "2027-08-04"
  conference_display: "August 2–4, 2027"
  countdown_iso: "2027-08-02T09:00:00"
  # `key` is a stable identifier used to look up a specific deadline from
  # templates (via the `deadline('key')` helper) — keep it even if you
  # reorder, add, or reword the list below.
  # Timeline confirmed: notification is set >=2 months before the conference
  # (66 days) so accepted authors have time to register, arrange travel, and
  # (where needed) apply for a visa. Modeled on the 2025 edition's cadence.
  deadlines:
    - key: "submission"
      label: "Full Paper Submission"
      note: "Via EasyChair — double-blind, fully anonymized"
      date: "April 23, 2027"
      iso: "2027-04-23"
      status: "upcoming"
    - key: "proposals"
      label: "Special Session / Workshop / Tutorial Proposals"
      note: "Via EasyChair — select the matching proposal track"
      date: "March 19, 2027"
      iso: "2027-03-19"
      status: "upcoming"
    - key: "notification"
      label: "Acceptance Notification"
      note: "Authors notified of review decisions"
      date: "May 28, 2027"
      iso: "2027-05-28"
      status: "upcoming"
    - key: "camera_ready"
      label: "Camera-Ready Submission"
      note: "Final manuscript and IEEE copyright form"
      date: "June 18, 2027"
      iso: "2027-06-18"
      status: "upcoming"
    - key: "conference"
      label: "Conference"
      note: "University of Stavanger, Norway"
      date: "August 2–4, 2027"
      iso: "2027-08-02"
      status: "upcoming"

venue:
  # Exact building/room on campus is still TBA — "Campus Ullandhaug" is UiS's
  # (verified) campus name; narrow this to a specific building once known.
  name: "Campus Ullandhaug"
  institution: "University of Stavanger"
  address: "Kjell Arholms gate 41"
  city: "Stavanger"
  country: "Norway"
  zip: "4021"
  maps_embed_url: "https://www.google.com/maps?q=Kjell+Arholms+gate+41,+4021+Stavanger,+Norway&output=embed"
  official_url: "https://www.uis.no/en"
  # Short clause appended after the institution name on the homepage venue teaser
  # (e.g. "...at the University of Stavanger — Norway's fastest-growing research university.").
  # Leave "" to omit the clause entirely.
  highlight: ""
  # Shown in the "Booking Note" info box on the Venue page — set this to whatever
  # is true this year (e.g. an official hotel block name + rate code, or this default).
  hotel_block_note: >
    There is no official conference hotel block. Attendees are advised to book early.
    Check this page for any group rate announcements.
  # TBA — add real transport guidance once local chairs are confirmed. Stavanger
  # Airport (SVG) has international connections; the campus is a short bus/taxi
  # ride from the city centre.
  transport: >
    Transport and parking details will be announced closer to the conference.
  about_city: >
    Stavanger is a coastal city on Norway's southwestern fjord region, known as the
    country's energy capital and a gateway to the Lysefjord and Preikestolen (Pulpit Rock).
    It combines a historic wooden old town (Gamle Stavanger) with a compact, walkable city
    centre. Early August typically brings mild summer weather, ideal for exploring the
    fjords and coastline between sessions.
  photos:
    - url: "https://cdn.sanity.io/images/nxpteyfv/goguides/49a23b45fef736e1bc5165097c37c21889049ba3-1600x1066.jpg"
      caption: "Norwegian fjords near Stavanger"
    - url: "https://www.fjords.com/wp-content/uploads/photo-gallery/FJORDS_Rogaland/DSC_9971.jpg?bwg=1577103120"
      caption: "Rogaland fjords"
    - url: "https://dam.thon.com/transform/753f95ea-1851-48d0-9894-dcad0cdd09b2/Thon_Hotels_Stavanger_Preikestolen"
      caption: "Preikestolen (Pulpit Rock)"
    - url: "https://wp.innocode-cdn.com/nebstar.eu/uploads/2023/03/University-of-Stavanger-1-scaled.jpg"
      caption: "University of Stavanger campus"
  hotels:
    # Star rating unconfirmed by an official source — booking sites disagree
    # between 3★ and 4★; going with 4★ per the hotel's own "Premium" branding.
    - name: "Ydalir Hotel"
      stars: 4
      distance: "2 min walk"
      note: "On campus at Ullandhaug"
      url: "https://ydalir.no/"
    - name: "Clarion Hotel® Energy"
      stars: 4
      distance: "~25 min walk, or a short bus/taxi ride"
      note: "Near DNB Arena"
      url: "https://www.strawberry.no/hotell/norge/stavanger/clarion-hotel-energy/"
    - name: "Thon Hotel Stavanger Forum"
      stars: 4
      distance: "~25 min walk, or a short bus/taxi ride"
      note: ""
      url: "https://www.thonhotels.no/hoteller/norge/stavanger/thon-hotel-stavanger-forum/"

# VISA information — entirely regime/host-country specific. Rewrite this whole
# block (not the visa.html template) if the conference moves to a country outside
# the Schengen Area.
visa:
  regime_name: "Schengen Area"
  eligibility_note: >
    EU/EEA/Swiss citizens do not need a VISA. Many other nationalities (US, UK, Canada,
    Australia, Japan, South Korea…) can enter for short stays without a VISA. Citizens
    of many other countries require a Schengen Short-Stay (C) VISA.
  national_portal:
    flag: "🇳🇴"
    label: "Norwegian VISA Portal"
    name: "Norwegian Directorate of Immigration (UDI)"
    domain_display: "udi.no"
    url: "https://www.udi.no/en/want-to-apply/visit-and-holiday/visitors-visa-to-norway/"
  regional_portal:
    flag: "🇪🇺"
    label: "Schengen VISA Info"
    org: "European Commission"
    url: "https://ec.europa.eu/home-affairs/policies/schengen-borders-and-visa/schengen-visa_en"

